# ---------------------------------------------------------------------------
# Catalyst scanner config
# ---------------------------------------------------------------------------

# SEC requires a real contact string. Override with the SEC_UA env var.
sec_user_agent: "Harry Xu harry.xu@example.com"

# The 7am run reports "what's new since the last email". lookback_days: 2 with
# the dedupe state file is how that's implemented — see README "Why not
# lookback_days: 1". Weekend filings are picked up by Monday's run via the
# weekend-aware logic in run.py.
lookback_days: 2
send_when_empty: true        # daily heartbeat so a silent failure is visible

universe:
  industries:
